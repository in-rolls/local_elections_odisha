[project]
name = "local-elections-odisha"
version = "0.1.0"
description = "Odisha gram panchayat sarpanch elections, with seat reservation, winners and sources"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Odisha", "elections", "panchayats", "sarpanch", "reservation", "data"]
dependencies = [
    "pandas>=2.3",
    "pyarrow>=21",
    "pdfplumber>=0.11",
    "requests>=2.32",
    "pysocks>=1.7.1",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_odisha"
Issues = "https://github.com/in-rolls/local_elections_odisha/issues"

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_odisha"]
